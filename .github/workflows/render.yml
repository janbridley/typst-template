name: Render Slides

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: typst-community/setup-typst@40d32bb6ccb235bd7f5164cb47cfd40a5ea3a314 # v5.2.0
        with:
          cache-dependency-path: main.typ

      # Extract the ```sh``` block from fonts/README.md
      - name: Fetch vendored fonts
        run: |
          if [ ! -f fonts/IosevkaSS07.ttc ]; then
            awk '/^```sh$/{f=1;next} /^```$/{f=0} f' fonts/README.md | sh -e
          fi
          typst fonts --font-path fonts | grep -qix 'Iosevka SS07'

      - name: Render PDF and per-slide SVGs
        run: |
          rm -rf slides && mkdir slides
          out=$(typst compile --font-path fonts main.typ main.pdf 2>&1) || { printf '%s\n' "$out"; exit 1; }
          printf '%s\n' "$out"
          [[ $out == *warning:* ]] && exit 1
          typst compile --font-path fonts main.typ 'slides/slide-{p}.svg'

      - name: Embed slides into README
        run: python3 .github/scripts/embed_slides.py

      - name: Upload rendered output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rendered
          path: |
            slides/
            main.pdf
            README.md
          if-no-files-found: error

  commit:
    needs: render
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true # git-auto-commit pushes with this token

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rendered
          path: ${{ runner.temp }}/rendered

      - name: Place rendered output
        run: |
          # Replace, don't merge.
          rm -rf slides && mkdir slides
          cp '${{ runner.temp }}/rendered/slides/'*.svg slides/
          cp '${{ runner.temp }}/rendered/main.pdf' main.pdf
          cp '${{ runner.temp }}/rendered/README.md' README.md

      - uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          commit_message: Render slides and embed them in the README
          file_pattern: slides/ README.md main.pdf
